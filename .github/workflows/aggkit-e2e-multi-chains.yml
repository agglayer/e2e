name: Aggkit E2E - Multi Chain
run-name: Run Aggkit multi-chain E2E by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      aggsender-find-imported-bridge-artifact:
        description: "Path for aggsender to find the imported bridge"
        required: true
        type: string

      kurtosis-cdk-ref:
        description: "The tag, branch, or commit of the kurtosis-cdk package that will be used"
        required: true
        type: string

      agglayer-e2e-ref:
        description: "The tag, branch, or commit of the agglayer/e2e repo that will used for running tests"
        required: true
        type: string

      kurtosis-cdk-args-1:
        description: "Input arguments for the Kurtosis CDK package 1."
        required: true
        type: string

      kurtosis-cdk-args-2:
        description: "Input arguments for the Kurtosis CDK package 2."
        required: true
        type: string

      kurtosis-cdk-args-3:
        description: "Input arguments for the Kurtosis CDK package 3."
        required: false
        type: string
        default: |
          {}

      kurtosis-cdk-enclave-name:
        description: "The name to be used for the kurtosis enclave"
        required: true
        type: string

      docker-image-override:
        description: "The docker image in kurtosis that will replaced with a local tag (e.g. agglayer_image)"
        required: false
        type: string
        default: ""

      docker-tag:
        description: "A local docker tag to be used as the image for a particular service in kurtosis (e.g. agglayer:local)"
        required: false
        type: string
        default: "local"

      docker-artifact-name:
        description: "A name of a docker image to download (e.g. docker-image)"
        required: false
        type: string
        default: "aggkit"

      number-of-chains:
        description: "The number of chains to run the test on"
        required: false
        type: number
        default: 2

      aggkit-config-artifact:
        description: "Optional artifact name holding aggkit-owned kurtosis config templates (aggkit-config.template.toml / aggkit-cdk-config.template.toml). When set, they are overlaid on kurtosis-cdk's static_files before the package runs, letting aggkit own its e2e config without a kurtosis-cdk change."
        required: false
        type: string
        default: ""

    secrets:
      DATADOG_API_KEY:
        description: "Datadog API key used to record the test run"
        required: false
      OPENAI_API_KEY:
        description: "OpenAI API key used for the optional AI analysis of test results"
        required: false

permissions:
  contents: read

jobs:
  test-multi-aggkit-e2e:
    name: Aggkit multi-chain E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agglayer-e2e
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agglayer/e2e
          ref: ${{ inputs.agglayer-e2e-ref }}
          path: agglayer-e2e
          persist-credentials: false

      - name: Checkout kurtosis-cdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 0xPolygon/kurtosis-cdk
          ref: ${{ inputs.kurtosis-cdk-ref }}
          path: kurtosis-cdk
          persist-credentials: false

      - name: Download binary
        if: inputs.aggsender-find-imported-bridge-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.aggsender-find-imported-bridge-artifact }}
          path: "/tmp"

      - name: Download artifact
        if: inputs.docker-artifact-name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.docker-artifact-name }}
          path: "/tmp"

      - name: Load image
        run: |
          if [[ -e /tmp/${{ inputs.docker-artifact-name }}.tar ]]; then
              docker load --input /tmp/${{ inputs.docker-artifact-name }}.tar
              docker images
          fi

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Install bats
        uses: bats-core/bats-action@42fcc8700f773c075a16a90eb11674c0318ad507 # 3.0.1

      - name: Install kurtosis cli and jq
        env:
          KURTOSIS_VERSION: "1.14.1"
          KURTOSIS_SHA256: "0bdb71dc20eaadba4812324d19acb2ebb4f77889b1c8dc32867288835e59b4da"
        run: |
          set -euo pipefail
          archive="kurtosis-cli_${KURTOSIS_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${KURTOSIS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/kurtosis"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/kurtosis" kurtosis
          echo "${RUNNER_TEMP}/kurtosis" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/kurtosis/kurtosis" analytics disable
          "${RUNNER_TEMP}/kurtosis/kurtosis" version
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Write args input to a file
        run: |
          if [[ "${{ inputs.kurtosis-cdk-args-3 }}" == "{}" && ${{ inputs.number-of-chains }} -eq 3 ]]; then
            echo "Error: kurtosis-cdk-args-3 is empty but number-of-chains is set to 3"
            exit 1
          fi
          docker_tag='${{ inputs.docker-tag }}'
          if [[ $docker_tag == "" ]]; then
              echo '${{ inputs.kurtosis-cdk-args-1 }}' | tee /tmp/kurtosis-args-1.json
              echo '${{ inputs.kurtosis-cdk-args-2 }}' | tee /tmp/kurtosis-args-2.json
              if [[ ${{ inputs.number-of-chains }} -eq 3 ]]; then
                echo '${{ inputs.kurtosis-cdk-args-3 }}' | tee /tmp/kurtosis-args-3.json
              fi
              exit
          fi
          echo '${{ inputs.kurtosis-cdk-args-1 }}' | jq --arg img '${{ inputs.docker-image-override }}' --arg tag '${{ inputs.docker-tag }}' '.args[$img] = $tag' | tee /tmp/kurtosis-args-1.json
          echo '${{ inputs.kurtosis-cdk-args-2 }}' | jq --arg img '${{ inputs.docker-image-override }}' --arg tag '${{ inputs.docker-tag }}' '.args[$img] = $tag' | tee /tmp/kurtosis-args-2.json
          if [[ ${{ inputs.number-of-chains }} -eq 3 ]]; then
            echo '${{ inputs.kurtosis-cdk-args-3 }}' | jq --arg img '${{ inputs.docker-image-override }}' --arg tag '${{ inputs.docker-tag }}' '.args[$img] = $tag' | tee /tmp/kurtosis-args-3.json
          fi

      # Let aggkit own its e2e config: overlay the aggkit-provided config
      # templates onto kurtosis-cdk's static_files before the package renders
      # them. No-op when the input is unset (other consumers are unaffected).
      - name: Download aggkit config override
        if: inputs.aggkit-config-artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.aggkit-config-artifact }}
          path: /tmp/aggkit-config
      - name: Apply aggkit config override
        if: inputs.aggkit-config-artifact != ''
        run: |
          set -eo pipefail
          dst=kurtosis-cdk/static_files/chain/shared/aggkit
          cp /tmp/aggkit-config/aggkit-config.template.toml "$dst/config.toml"
          if [[ -f /tmp/aggkit-config/aggkit-cdk-config.template.toml ]]; then
            cp /tmp/aggkit-config/aggkit-cdk-config.template.toml "$dst/cdk-config.toml"
          fi
          echo "Applied aggkit-owned config templates over kurtosis-cdk static_files:"
          ls -l "$dst"

      - name: Startup the kurtosis-cdk package
        run: |
          pushd kurtosis-cdk || exit 1
          kurtosis run --enclave '${{ inputs.kurtosis-cdk-enclave-name }}' --args-file /tmp/kurtosis-args-1.json .
          kurtosis run --enclave '${{ inputs.kurtosis-cdk-enclave-name }}' --args-file /tmp/kurtosis-args-2.json .
          if [[ ${{ inputs.number-of-chains }} -eq 3 ]]; then
            kurtosis run --enclave '${{ inputs.kurtosis-cdk-enclave-name }}' --args-file /tmp/kurtosis-args-3.json .
          fi
          popd

      - name: Run e2e tests
        run: |
          pushd agglayer-e2e || exit 1
          set -a
          source ./tests/.env
          set +a
          export BATS_LIB_PATH="$PWD/core/helpers/lib"
          export PROJECT_ROOT="$PWD"
          export ENCLAVE_NAME="${{ inputs.kurtosis-cdk-enclave-name }}"
          chmod +x "/tmp/${{ inputs.aggsender-find-imported-bridge-artifact }}"
          export AGGSENDER_IMPORTED_BRIDGE_PATH="/tmp/${{ inputs.aggsender-find-imported-bridge-artifact }}"
          if [[ ${{ inputs.number-of-chains }} -eq 3 ]]; then
            bats ./tests/aggkit/bridge-e2e-3-chains.bats
          else
            bats ./tests/aggkit/bridge-e2e-2-chains.bats
          fi
          popd

      - name: Dump enclave logs
        if: ${{ failure() }}
        run: kurtosis dump ./dump

      - name: Generate archive name
        if: ${{ failure() }}
        run: |
          archive_name="dump_run_with_args_${{ inputs.number-of-chains}}_${{ github.run_id }}"
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"
          echo "Generated archive name: ${archive_name}"

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ./dump

      - name: Clean up kurtosis-cdk enclave
        if: ${{ always() }}
        run: |
          kurtosis enclave stop '${{ inputs.kurtosis-cdk-enclave-name }}'
          kurtosis clean

      - name: Record test run in Datadog
        if: always()
        continue-on-error: true
        uses: agglayer/gha-record-e2e-test-run@3d8941f5a639c9ad00853e59990255ae08f647fe # v1
        with:
          enable_ai_analysis: "true"
          host: "github-actions-runners"
          status: ${{ job.status }}
          ref_kurtosis: "${{ inputs.kurtosis-cdk-ref }}"
          ref_e2e: "${{ inputs.agglayer-e2e-ref }}"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
